name: Bazaar Radar — Weekly affiliate picks (+ forward test) and seller brief

# Sundays 12:30 IST, after the daily fetch. Picks are also the model's forward test:
# each pick is tracked against random same-category products for 7/14/28 days (PICK_SCORECARD tab).
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  affiliate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas beautifulsoup4 gspread google-auth openpyxl tweepy
      - name: Pick, record baseline, post
        env:
          BR_MODE:            affiliate
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_TAG:      ${{ secrets.AFFILIATE_TAG }}
          AFFILIATE_CHAT_ID:  ${{ secrets.AFFILIATE_CHAT_ID }}
          X_API_KEY:          ${{ secrets.X_API_KEY }}
          X_API_SECRET:       ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:     ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:    ${{ secrets.X_ACCESS_SECRET }}
          X_MAX_POSTS_PER_RUN: ${{ vars.X_MAX_POSTS_PER_RUN || '8' }}
        run: python trend_fetcher.py
      - name: Weekly seller brief (sample for the DaaS demand test → admin chat)
        if: always()
        env:
          BR_MODE:            brief
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend_fetcher.py
      - name: Save brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-radar-brief
          path: output/
          if-no-files-found: ignore
          retention-days: 30
