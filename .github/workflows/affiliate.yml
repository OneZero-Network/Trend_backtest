name: Bazaar Radar — Weekly seller brief (picks now post via the drip workflow)

# Sundays 12:30 IST, after the daily fetch. Picks are also the model's forward test:
# each pick is tracked against random same-category products for 7/14/28 days (PICK_SCORECARD tab).
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  affiliate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas beautifulsoup4 gspread google-auth openpyxl tweepy
      - name: Weekly seller brief (sample for the DaaS demand test → admin chat)
        env:
          BR_MODE:            brief
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend_fetcher.py
      - name: Save brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-radar-brief
          path: output/
          if-no-files-found: ignore
          retention-days: 30
