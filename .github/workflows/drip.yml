name: Bazaar Radar — Affiliate drip posts (every 2 h, 9 am–9 pm IST)

# The daily fetch (7:45 IST) produces fresh data. The first drip run of the day builds a pool of
# in-stock, rising picks (AFF_POOL tab) and records the forward test; every run posts the next 1–2.
# No Amazon requests here — only Google Sheets + Telegram (~30 s per run).
# Times are UTC: 03:30 … 15:30 UTC = 9 am … 9 pm IST. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "30 3-15/2 * * *"   # BACKUP — the Cloudflare Worker starts it on time; a run within 75 min of the last post does nothing
  workflow_dispatch:

concurrency:
  group: drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas beautifulsoup4 gspread google-auth openpyxl
      - name: Post next picks
        env:
          BR_MODE:             drip
          GOOGLE_CREDS_JSON:   ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:     ${{ secrets.GOOGLE_SHEET_ID }}
          AFFILIATE_SHEET_ID:  ${{ secrets.AFFILIATE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_TAG:       ${{ secrets.AFFILIATE_TAG }}
          AFFILIATE_CHAT_ID:   ${{ secrets.AFFILIATE_CHAT_ID }}
          AFFILIATE_BOT_TOKEN: ${{ secrets.AFFILIATE_BOT_TOKEN }}
          FLIPKART_AFFID:      ${{ secrets.FLIPKART_AFFID }}
          FLIPKART_LINK_TEMPLATE: ${{ secrets.FLIPKART_LINK_TEMPLATE }}   # network deep-link format with {url}     # Flipkart lane posts only when this is set AND the lead test passed
          BR_FLIPKART_HOUR:    ${{ vars.BR_FLIPKART_HOUR || '19' }}
          AFFILIATE_GROUPS:    ${{ secrets.AFFILIATE_GROUPS }}
          BR_POOL_SIZE:        ${{ vars.BR_POOL_SIZE || '12' }}
          AFF_POST_TITLE:      ${{ vars.AFF_POST_TITLE || 'Amazon Hidden Bestsellers' }}   # title line of every channel post
          BR_DURABLE_SHARE:    ${{ vars.BR_DURABLE_SHARE || '0.67' }}   # share of public picks from the durable arm (0 = momentum only, 1 = durable only)
          # v1.60 growth machine — everything that costs money is OFF until you set it
          AFF_TAGS:            ${{ vars.AFF_TAGS }}               # one tracking ID per channel: telegram=…-21, whatsapp=…-21, x=…-21, bot=…-21
          WA_CHANNEL_URL:      ${{ vars.WA_CHANNEL_URL }}         # your WhatsApp Channel link (goes in the WhatsApp footer)
          AFF_WA_HOURS:        ${{ vars.AFF_WA_HOURS }}           # extra WhatsApp-ready batches at these IST hours (the daily one is always sent)
          BR_ROUNDUP_HOUR:     ${{ vars.BR_ROUNDUP_HOUR || '11' }}   # Sunday "lasting bestsellers" post
          BR_POLL_HOUR:        ${{ vars.BR_POLL_HOUR || '19' }}      # Wednesday poll (0 = off)
          AFF_X_MODE:          ${{ vars.AFF_X_MODE || 'off' }}       # off | dry | linkfree | links
          AFF_X_MAX_PER_DAY:   ${{ vars.AFF_X_MAX_PER_DAY || '4' }}
          AFF_X_BUDGET_USD:    ${{ vars.AFF_X_BUDGET_USD || '10' }}  # per calendar month; ALSO set a spend limit in the X console
          X_API_KEY:           ${{ secrets.X_API_KEY }}
          X_API_SECRET:        ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:      ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:     ${{ secrets.X_ACCESS_SECRET }}
          AFF_COPY_AGENT:      ${{ vars.AFF_COPY_AGENT }}         # 'claude' = rewrite X hooks for variety (fact-checked); empty = templates only
          AFF_COPY_MODEL:      ${{ vars.AFF_COPY_MODEL || 'claude-haiku-5-5' }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          WORKER_URL:          ${{ vars.WORKER_URL }}             # v1.80: picks up /deal and /card from the bot
          WORKER_KEY:          ${{ secrets.WORKER_KEY }}
          SAVINGS_SLOTS:       ${{ vars.SAVINGS_SLOTS || '13,19' }}      # IST hours for EarnKaro deals / card offers ('' = off)
          SAVINGS_PER_DAY:     ${{ vars.SAVINGS_PER_DAY || '2' }}
          CARDS_PER_WEEK:      ${{ vars.CARDS_PER_WEEK || '2' }}
          SAVINGS_DOMAINS:     ${{ vars.SAVINGS_DOMAINS || 'ekaro.in,earnkaro.com' }}
        run: python trend_fetcher.py
