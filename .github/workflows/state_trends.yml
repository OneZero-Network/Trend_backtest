name: Bazaar Radar — State Search Interest (weekly)

# Isolated from the daily run on purpose: ~20 rate-limited Google Trends calls.
# A failure here never affects AMZ_* tabs or TREND_SIGNALS.
on:
  schedule:
    - cron: "30 5 * * 0"     # Sundays 11:00 IST
  workflow_dispatch:

jobs:
  states:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas beautifulsoup4 gspread google-auth pytrends
      - name: Run state interest
        env:
          BR_MODE:            states
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BR_SEED_KEYWORDS:   ${{ vars.BR_SEED_KEYWORDS }}
        run: python trend_fetcher.py

      - name: Save run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-radar-states
          path: output/
          if-no-files-found: ignore
          retention-days: 14
