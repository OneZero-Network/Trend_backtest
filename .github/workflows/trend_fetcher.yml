name: Bazaar Radar — India E-commerce Trend Fetcher

on:
  # 09:30 IST daily (04:00 UTC). Daily, not weekday-only: e-commerce sells 7 days
  # a week, and gaps in HISTORY weaken the rank-velocity signal.
  schedule:
    - cron: "15 2 * * *"     # 07:45 IST — data ready before the 9 am drip post
  workflow_dispatch:
    inputs:
      reason:
        description: "Trigger reason"
        required: false
        default: "Manual run"

permissions:
  contents: write          # to push the daily archive to the data-archive branch

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # lists ≈ 20-30 min + 30 product pages ≈ 3 min (state trends moved to state_trends.yml)

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas beautifulsoup4 gspread google-auth openpyxl
          pip install curl_cffi || echo "curl_cffi failed — plain requests fallback (more Amazon blocks)"
          pip install pytrends  || echo "pytrends failed — rising queries skipped"
      - name: Run Bazaar Radar
        env:
          GOOGLE_CREDS_JSON:  ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID:    ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          BR_CATEGORIES:      ${{ vars.BR_CATEGORIES }}
          BR_SEED_KEYWORDS:   ${{ vars.BR_SEED_KEYWORDS }}
          BR_DETAIL_TOP_N:    ${{ vars.BR_DETAIL_TOP_N || '6' }}
          BR_CALC_TOP_N:      ${{ vars.BR_CALC_TOP_N || '25' }}
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
        run: python trend_fetcher.py
      - name: Archive today's data permanently (data-archive branch)
        if: always()
        run: |
          [ -d output/archive ] || { echo "No archive files this run"; exit 0; }
          A=$(mktemp -d) && cp -r output/archive/. "$A"/
          git config user.name  "bazaar-radar-bot"
          git config user.email "bazaar-radar-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-archive >/dev/null 2>&1; then
            git fetch --depth=1 origin data-archive
            git checkout -f -B data-archive FETCH_HEAD
          else
            git checkout --orphan data-archive
            git rm -rf --quiet . || true
            printf "# Bazaar Radar daily archive\n\narchive/YYYY-MM-DD/{history,signals,gtrends}.csv.gz — one folder per day, kept forever.\n" > README.md
            git add README.md
          fi
          mkdir -p archive && cp -r "$A"/. archive/
          git add archive
          git commit -m "archive $(date -u +%F)" || echo "Nothing new to archive"
          git push origin data-archive

      - name: Save run output (always, so data survives a Sheets problem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-radar-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on workflow failure (Telegram)
        if: failure()
        run: |
          TEXT="$(printf '❌ Bazaar Radar — GitHub Actions FAILED\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
          curl -s --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               --data-urlencode "text=${TEXT}" --data-urlencode "parse_mode=HTML" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
