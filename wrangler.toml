name = "bazaar-radar-scheduler"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
GH_OWNER = "OneZero-Network"
GH_REPO  = "Trend_backtest"
GH_REF   = "main"          # change if your default branch is "master"
# v1.60 shopper bot (optional — the scheduler works without these)
AFF_TAG_BOT      = ""      # tracking ID for links the bot sends, e.g. ozbot-21 (create it in Associates Central)
CHANNEL_JOIN_URL = ""      # the 'bot' invite link from the GROWTH_LINKS tab (created by the growth job)
INDEX_PATH       = "bot/radar_index.json"
INDEX_REF        = "data-archive"
# v1.70 owner desk: your own Telegram user id (message @userinfobot to see it). Falls back to TG_CHAT_ID.
OWNER_CHAT_ID    = ""

[triggers]
# UTC. Must match JOBS in worker.js exactly.
crons = ["15 2 * * *", "30 3-15/2 * * *"]

# v1.60: counts channel joins per invite link and bot use. v1.70: REQUIRED for the owner desk (command queue,
# uploaded reports, /floor, /leads). Create it once:
#   npx wrangler kv namespace create RADAR_KV   → paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "RADAR_KV"
# id = "<the id wrangler printed>"
